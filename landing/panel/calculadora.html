<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora ONAT - VerifiCuba Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel-layout">
    <nav id="panel-nav" class="panel-sidebar"></nav>

    <main class="panel-main">
      <header class="panel-header">
        <h1>Calculadora ONAT</h1>
        <p class="subtitle">Calcula tus obligaciones fiscales TCP/MIPYME</p>
      </header>

      <div id="alert-container"></div>

      <!-- Calculator form -->
      <div class="panel-card">
        <form id="calc-form" novalidate>
          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Tipo de actor</label>
              <select id="tipo_actor" name="tipo_actor" class="form-select" required>
                <option value="">Selecciona...</option>
                <option value="TCP">TCP (Trabajador por Cuenta Propia)</option>
                <option value="MIPYME">MIPYME</option>
                <option value="CNA">CNA (Cooperativa No Agropecuaria)</option>
                <option value="Estatal">Empresa Estatal</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Mes</label>
              <input type="month" id="mes" name="mes" class="form-input" required>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Ventas brutas (CUP)</label>
              <input type="number" id="ventas" name="ventas" class="form-input" placeholder="0.00" step="0.01" min="0" required>
            </div>
            <div class="form-group">
              <label class="form-label">Gastos deducibles (CUP)</label>
              <input type="number" id="gastos" name="gastos" class="form-input" placeholder="0.00" step="0.01" min="0" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg">Calcular</button>
        </form>
      </div>

      <!-- Results -->
      <div class="panel-card" id="results-card" style="display:none;">
        <h2>Resultado del cálculo</h2>
        <div class="grid grid-4" id="results-grid">
          <!-- Filled by JS -->
        </div>
        <div class="flex gap-2 mt-3">
          <button type="button" id="save-btn" class="btn btn-success">Guardar cálculo</button>
          <button type="button" id="print-btn" class="btn btn-secondary">Imprimir</button>
        </div>
      </div>

      <!-- History -->
      <div class="panel-card">
        <div class="flex flex-between" style="margin-bottom:1rem;">
          <h2>Historial de cálculos</h2>
          <button type="button" id="clear-history" class="btn btn-sm btn-danger">Limpiar historial</button>
        </div>
        <div class="table-container">
          <table class="table" id="history-table">
            <thead>
              <tr>
                <th>Mes</th>
                <th>Tipo</th>
                <th>Ventas</th>
                <th>Gastos</th>
                <th>Utilidad</th>
                <th>Impuesto</th>
                <th>Fecha</th>
                <th></th>
              </tr>
            </thead>
            <tbody>
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
        <p id="history-empty" class="text-center text-muted" style="display:none; padding:2rem;">No hay cálculos guardados.</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { pb } from './js/pb.js';
    import { initNav } from './js/nav.js';
    import { getCurrentNegocioId, encolarLocal } from './js/auth.js';
    import { encolarLocal as encolarSync, flushCola } from './js/sync-queue.js';

    initNav();

    const alertContainer = document.getElementById('alert-container');
    const calcForm = document.getElementById('calc-form');
    const resultsCard = document.getElementById('results-card');
    const resultsGrid = document.getElementById('results-grid');
    const saveBtn = document.getElementById('save-btn');
    const printBtn = document.getElementById('print-btn');
    const historyTable = document.getElementById('history-table').querySelector('tbody');
    const historyEmpty = document.getElementById('history-empty');
    const clearHistoryBtn = document.getElementById('clear-history');

    let currentResults = null;
    let currentNegocioId = null;

    function showAlert(message, type = 'info') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'}
          </svg>
          <span>${message}</span>
        </div>
      `;
      setTimeout(() => alertContainer.innerHTML = '', 5000);
    }

    function formatCUP(amount) {
      return new Intl.NumberFormat('es-CU', { style: 'currency', currency: 'CUP', maximumFractionDigits: 2 }).format(amount);
    }

    function calculateONAT(tipo_actor, ventas, gastos) {
      const utilidad = ventas - gastos;
      let impuesto = 0;
      let detalle = {};

      if (tipo_actor === 'TCP') {
        // TCP: 10% sobre utilidad neta, mínimo 1% sobre ventas brutas
        const porUtilidad = utilidad * 0.10;
        const minimo = ventas * 0.01;
        impuesto = Math.max(porUtilidad, minimo);
        detalle = { porUtilidad, minimo, base: utilidad };
      } else if (tipo_actor === 'MIPYME') {
        // MIPYME: 35% sobre utilidad neta
        impuesto = utilidad > 0 ? utilidad * 0.35 : 0;
        detalle = { base: utilidad, tasa: 0.35 };
      } else if (tipo_actor === 'CNA') {
        // CNA: 35% sobre utilidad neta (similar a MIPYME)
        impuesto = utilidad > 0 ? utilidad * 0.35 : 0;
        detalle = { base: utilidad, tasa: 0.35 };
      } else {
        // Estatal: régimen especial
        impuesto = 0;
        detalle = { regimen: 'especial' };
      }

      return { utilidad, impuesto, detalle };
    }

    function renderResults(r) {
      resultsGrid.innerHTML = `
        <div class="stat-card">
          <div class="label">Utilidad neta</div>
          <div class="value ${r.utilidad >= 0 ? 'success' : 'danger'}">${formatCUP(r.utilidad)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Impuesto estimado</div>
          <div class="value warning">${formatCUP(r.impuesto)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Ventas brutas</div>
          <div class="value">${formatCUP(r.ventas)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Gastos deducibles</div>
          <div class="value">${formatCUP(r.gastos)}</div>
        </div>
      `;
      resultsCard.style.display = 'block';
    }

    async function loadHistory() {
      if (!currentNegocioId) return;
      
      try {
        const records = await pb.collection('calculos_onat').getList(1, 20, {
          filter: `negocio = "${currentNegocioId}"`,
          sort: '-mes'
        });

        if (records.items.length === 0) {
          historyTable.innerHTML = '';
          historyEmpty.style.display = 'block';
          return;
        }

        historyEmpty.style.display = 'none';
        historyTable.innerHTML = records.items.map(c => `
          <tr>
            <td>${new Date(c.mes).toLocaleDateString('es-CU', { month: 'long', year: 'numeric' })}</td>
            <td><span class="badge">${c.tipo_actor}</span></td>
            <td>${formatCUP(c.ventas)}</td>
            <td>${formatCUP(c.gastos)}</td>
            <td>${formatCUP(c.ventas - c.gastos)}</td>
            <td>${formatCUP(c.resultados?.impuesto_total || 0)}</td>
            <td>${new Date(c.created).toLocaleDateString('es-CU')}</td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="loadCalc('${c.id}')">Cargar</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Load history error:', err);
      }
    }

    window.loadCalc = async function(id) {
      try {
        const record = await pb.collection('calculos_onat').getOne(id);
        document.getElementById('tipo_actor').value = record.tipo_actor;
        document.getElementById('mes').value = record.mes.split('T')[0];
        document.getElementById('ventas').value = record.ventas;
        document.getElementById('gastos').value = record.gastos;
        calcForm.dispatchEvent(new Event('submit'));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        showAlert('Error cargando cálculo: ' + err.message, 'error');
      }
    };

    async function init() {
      currentNegocioId = await getCurrentNegocioId();
      if (!currentNegocioId) {
        showAlert('No se encontró tu negocio. Completa tu perfil primero.', 'warning');
        return;
      }
      await loadHistory();
    }

    calcForm.addEventListener('submit', (e) => {
      e.preventDefault();

      const tipo_actor = calcForm.tipo_actor.value;
      const mes = calcForm.mes.value;
      const ventas = parseFloat(calcForm.ventas.value);
      const gastos = parseFloat(calcForm.gastos.value);

      if (!tipo_actor || !mes || isNaN(ventas) || isNaN(gastos)) {
        showAlert('Completa todos los campos', 'error');
        return;
      }

      const results = calculateONAT(tipo_actor, ventas, gastos);
      results.ventas = ventas;
      results.gastos = gastos;
      results.mes = mes;
      results.tipo_actor = tipo_actor;
      currentResults = results;

      renderResults(results);
    });

    saveBtn.addEventListener('click', async () => {
      if (!currentResults || !currentNegocioId) return;

      saveBtn.disabled = true;
      saveBtn.textContent = 'Guardando...';

      const data = {
        negocio: currentNegocioId,
        mes: currentResults.mes + '-01',
        tipo_actor: currentResults.tipo_actor,
        ventas: currentResults.ventas,
        gastos: currentResults.gastos,
        resultados: {
          utilidad_neta: currentResults.utilidad,
          impuesto_total: currentResults.impuesto,
          detalle: currentResults.detalle
        }
      };

      try {
        await pb.collection('calculos_onat').create(data);
        showAlert('Cálculo guardado correctamente', 'success');
        await loadHistory();
      } catch (err) {
        // Offline fallback
        encolarSync({ collection: 'calculos_onat', data });
        showAlert('Sin conexión. Guardado localmente, se sincronizará al volver.', 'warning');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Guardar cálculo';
      }
    });

    printBtn.addEventListener('click', () => {
      window.print();
    });

    clearHistoryBtn.addEventListener('click', async () => {
      if (!confirm('¿Eliminar todo el historial de cálculos?')) return;
      
      try {
        const records = await pb.collection('calculos_onat').getList(1, 100, {
          filter: `negocio = "${currentNegocioId}"`
        });
        for (const r of records.items) {
          await pb.collection('calculos_onat').delete(r.id);
        }
        showAlert('Historial eliminado', 'success');
        await loadHistory();
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      }
    });

    init();
  </script>
</body>
</html>
