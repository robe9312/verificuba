<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - VerifiCuba Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel-layout">
    <nav id="panel-nav" class="panel-sidebar"></nav>

    <main class="panel-main">
      <header class="panel-header">
        <h1>Perfil del negocio</h1>
        <p class="subtitle">Gestiona los datos de tu negocio en VerifiCuba</p>
      </header>

      <div id="alert-container"></div>

      <!-- Business info form -->
      <div class="panel-card">
        <h2>Datos del negocio</h2>
        <form id="perfil-form" novalidate>
          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Nombre del negocio *</label>
              <input type="text" id="nombre" name="nombre" class="form-input" placeholder="Ej: Mi Cafetería" required>
            </div>
            <div class="form-group">
              <label class="form-label">Tipo de actor *</label>
              <select id="tipo_actor" name="tipo_actor" class="form-select" required>
                <option value="">Selecciona...</option>
                <option value="TCP">TCP (Trabajador por Cuenta Propia)</option>
                <option value="MIPYME">MIPYME</option>
                <option value="CNA">CNA (Cooperativa No Agropecuaria)</option>
                <option value="Estatal">Empresa Estatal</option>
              </select>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Categoría</label>
              <select id="categoria" name="categoria" class="form-select">
                <option value="">Selecciona...</option>
                <!-- Filled by JS -->
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Provincia *</label>
              <select id="provincia" name="provincia" class="form-select" required>
                <option value="">Selecciona...</option>
                <option value="La Habana">La Habana</option>
                <option value="Matanzas">Matanzas</option>
                <option value="Santiago de Cuba">Santiago de Cuba</option>
                <option value="Holguín">Holguín</option>
                <option value="Villa Clara">Villa Clara</option>
                <option value="Camagüey">Camagüey</option>
                <option value="Granma">Granma</option>
                <option value="Las Tunas">Las Tunas</option>
                <option value="Cienfuegos">Cienfuegos</option>
                <option value="Pinar del Río">Pinar del Río</option>
                <option value="Sancti Spíritus">Sancti Spíritus</option>
                <option value="Ciego de Ávila">Ciego de Ávila</option>
                <option value="Guantánamo">Guantánamo</option>
                <option value="Artemisa">Artemisa</option>
                <option value="Mayabeque">Mayabeque</option>
                <option value="Isla de la Juventud">Isla de la Juventud</option>
              </select>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Municipio</label>
              <input type="text" id="municipio" name="municipio" class="form-input" placeholder="Ej: Plaza de la Revolución">
            </div>
            <div class="form-group">
              <label class="form-label">Dirección</label>
              <input type="text" id="direccion" name="direccion" class="form-input" placeholder="Calle, número, entrecalles">
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Teléfono</label>
              <input type="tel" id="telefono" name="telefono" class="form-input" placeholder="+53 XX XXXXXXX">
            </div>
            <div class="form-group">
              <label class="form-label">WhatsApp *</label>
              <input type="tel" id="whatsapp" name="whatsapp" class="form-input" placeholder="+53 5 XXXXXXX" required>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Email</label>
              <input type="email" id="email" name="email" class="form-input" placeholder="negocio@ejemplo.com">
            </div>
            <div class="form-group">
              <label class="form-label">Métodos de pago</label>
              <select id="metodos_pago" name="metodos_pago" class="form-select" multiple style="height: auto;">
                <option value="Transfermóvil">Transfermóvil</option>
                <option value="EnZona">EnZona</option>
                <option value="Efectivo">Efectivo</option>
                <option value="Cripto">Cripto</option>
                <option value="Tarjeta MLC">Tarjeta MLC</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Descripción</label>
            <textarea id="descripcion" name="descripcion" class="form-textarea" rows="4" placeholder="Describe tu negocio, servicios, horarios..."></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Horario</label>
            <input type="text" id="horario" name="horario" class="form-input" placeholder="Ej: Lun-Vie 8:00-17:00, Sáb 8:00-12:00">
          </div>

          <button type="submit" class="btn btn-primary btn-lg">Guardar cambios</button>
        </form>
      </div>

      <!-- Status info -->
      <div class="panel-card">
        <h2>Estado en VerifiCuba</h2>
        <div id="status-info">
          <!-- Filled by JS -->
        </div>
      </div>

      <!-- Account actions -->
      <div class="panel-card">
        <h2>Cuenta</h2>
        <div class="grid grid-2" style="gap: 1rem;">
          <button type="button" id="change-password-btn" class="btn btn-secondary">Cambiar contraseña</button>
          <button type="button" id="logout-btn" class="btn btn-danger">Cerrar sesión</button>
        </div>
      </div>
    </main>
  </div>

  <!-- Change password modal -->
  <div id="password-modal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:1000; align-items:center; justify-content:center;">
    <div style="background:var(--surface); padding:2rem; border-radius:var(--radius); width:100%; max-width:420px; margin:1rem;">
      <h2>Cambiar contraseña</h2>
      <form id="password-form" novalidate>
        <div class="form-group">
          <label class="form-label">Contraseña actual</label>
          <input type="password" id="current-password" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Nueva contraseña</label>
          <input type="password" id="new-password" class="form-input" required minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label">Confirmar nueva contraseña</label>
          <input type="password" id="confirm-password" class="form-input" required minlength="8">
        </div>
        <div class="flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary">Guardar</button>
          <button type="button" id="cancel-password" class="btn btn-secondary">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { pb } from './js/pb.js';
    import { initNav } from './js/nav.js';
    import { getCurrentNegocioId, logout } from './js/auth.js';

    initNav();

    const alertContainer = document.getElementById('alert-container');
    const perfilForm = document.getElementById('perfil-form');
    const statusInfo = document.getElementById('status-info');
    const categoriaSelect = document.getElementById('categoria');
    const changePasswordBtn = document.getElementById('change-password-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const passwordModal = document.getElementById('password-modal');
    const passwordForm = document.getElementById('password-form');
    const cancelPasswordBtn = document.getElementById('cancel-password');

    let currentNegocioId = null;
    let currentNegocio = null;

    function showAlert(message, type = 'info') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'}
          </svg>
          <span>${message}</span>
        </div>
      `;
      setTimeout(() => alertContainer.innerHTML = '', 5000);
    }

    function getBadgeClass(estado) {
      const map = {
        'Pendiente': 'badge-pending',
        'Verificado': 'badge-verificado',
        'Activo': 'badge-activo',
        'Suspendido': 'badge-suspendido'
      };
      return map[estado] || '';
    }

    async function loadCategorias() {
      try {
        const records = await pb.collection('categorias').getList(1, 100, {
          filter: 'activa = true',
          sort: 'orden'
        });
        categoriaSelect.innerHTML = '<option value="">Selecciona...</option>' + records.items.map(c => 
          `<option value="${c.id}">${c.icono || ''} ${c.nombre}</option>`
        ).join('');
      } catch (err) {
        console.error('Load categorias error:', err);
      }
    }

    async function loadPerfil() {
      currentNegocioId = await getCurrentNegocioId();
      if (!currentNegocioId) {
        showAlert('No se encontró tu negocio.', 'warning');
        return;
      }

      try {
        const negocio = await pb.collection('negocios').getOne(currentNegocioId, {
          expand: 'categoria'
        });
        currentNegocio = negocio;

        // Fill form
        document.getElementById('nombre').value = negocio.nombre || '';
        document.getElementById('tipo_actor').value = negocio.tipo_actor || '';
        document.getElementById('categoria').value = negocio.categoria || '';
        document.getElementById('provincia').value = negocio.provincia || '';
        document.getElementById('municipio').value = negocio.municipio || '';
        document.getElementById('direccion').value = negocio.direccion || '';
        document.getElementById('telefono').value = negocio.telefono || '';
        document.getElementById('whatsapp').value = negocio.whatsapp || '';
        document.getElementById('email').value = negocio.email || '';
        document.getElementById('descripcion').value = negocio.descripcion || '';
        document.getElementById('horario').value = negocio.horario || '';
        
        if (negocio.metodos_pago) {
          const mp = Array.isArray(negocio.metodos_pago) ? negocio.metodos_pago : [negocio.metodos_pago];
          document.querySelectorAll('#metodos_pago option').forEach(opt => {
            opt.selected = mp.includes(opt.value);
          });
        }

        // Render status
        const user = pb.authStore.model;
        statusInfo.innerHTML = `
          <div class="grid grid-3" style="gap:1rem;">
            <div class="panel-card" style="text-align:center; padding:1.5rem;">
              <div style="font-size:2rem; margin-bottom:.5rem;">
                <span class="badge ${getBadgeClass(negocio.estado)}" style="font-size:1rem;">${negocio.estado}</span>
              </div>
              <div class="text-muted">Estado en el directorio</div>
            </div>
            <div class="panel-card" style="text-align:center; padding:1.5rem;">
              <div style="font-size:2rem; margin-bottom:.5rem; font-weight:700; color:var(--primary);">${negocio.plan || 'Básico'}</div>
              <div class="text-muted">Plan actual</div>
            </div>
            <div class="panel-card" style="text-align:center; padding:1.5rem;">
              <div style="font-size:2rem; margin-bottom:.5rem; font-weight:700;">${negocio.indice_confianza ? Math.round(negocio.indice_confianza * 100) + '%' : 'N/A'}</div>
              <div class="text-muted">Índice de confianza</div>
            </div>
          </div>
          <div class="mt-3">
            <p><strong>Usuario:</strong> ${user?.whatsapp || user?.email || 'N/A'}</p>
            <p><strong>Negocio:</strong> ${negocio.nombre} (${negocio.categoria?.expand?.nombre || 'Sin categoría'})</p>
            <p><strong>Ubicación:</strong> ${negocio.municipio || ''}, ${negocio.provincia || ''}</p>
            <p><strong>WhatsApp:</strong> ${negocio.whatsapp || 'No registrado'}</p>
            <p><strong>Verificado el:</strong> ${negocio.fecha_verificacion ? new Date(negocio.fecha_verificacion).toLocaleDateString('es-CU') : 'Pendiente'}</p>
            <p><strong>URL pública:</strong> <a href="https://verificuba.netlify.app/negocio/${negocio.slug || negocio.id}" target="_blank">verificuba.netlify.app/negocio/${negocio.slug || negocio.id}</a></p>
          </div>
        `;
      } catch (err) {
        console.error('Load perfil error:', err);
        showAlert('Error cargando perfil: ' + err.message, 'error');
      }
    }

    async function init() {
      await loadCategorias();
      await loadPerfil();
    }

    perfilForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = {
        nombre: perfilForm.nombre.value.trim(),
        tipo_actor: perfilForm.tipo_actor.value,
        categoria: perfilForm.categoria.value || null,
        provincia: perfilForm.provincia.value,
        municipio: perfilForm.municipio.value.trim(),
        direccion: perfilForm.direccion.value.trim(),
        telefono: perfilForm.telefono.value.trim(),
        whatsapp: perfilForm.whatsapp.value.trim(),
        email: perfilForm.email.value.trim(),
        descripcion: perfilForm.descripcion.value.trim(),
        horario: perfilForm.horario.value.trim(),
        metodos_pago: Array.from(perfilForm.metodos_pago.selectedOptions).map(opt => opt.value)
      };

      // Validate required
      if (!data.nombre || !data.tipo_actor || !data.provincia || !data.whatsapp) {
        showAlert('Completa los campos obligatorios (marcados con *)', 'error');
        return;
      }

      const submitBtn = perfilForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      try {
        await pb.collection('negocios').update(currentNegocioId, data);
        showAlert('Perfil actualizado correctamente', 'success');
        await loadPerfil();
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar cambios';
      }
    });

    changePasswordBtn.addEventListener('click', () => {
      passwordModal.style.display = 'flex';
      document.getElementById('current-password').focus();
    });

    cancelPasswordBtn.addEventListener('click', () => {
      passwordModal.style.display = 'none';
      passwordForm.reset();
    });

    passwordModal.addEventListener('click', (e) => {
      if (e.target === passwordModal) {
        passwordModal.style.display = 'none';
        passwordForm.reset();
      }
    });

    passwordForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const current = document.getElementById('current-password').value;
      const newPass = document.getElementById('new-password').value;
      const confirm = document.getElementById('confirm-password').value;

      if (newPass !== confirm) {
        showAlert('Las contraseñas no coinciden', 'error');
        return;
      }
      if (newPass.length < 8) {
        showAlert('La contraseña debe tener al menos 8 caracteres', 'error');
        return;
      }

      try {
        await pb.collection('users').update(pb.authStore.model.id, {
          password: newPass,
          passwordConfirm: newPass,
          oldPassword: current
        });
        showAlert('Contraseña cambiada correctamente', 'success');
        passwordModal.style.display = 'none';
        passwordForm.reset();
      } catch (err) {
        showAlert('Error: ' + (err.response?.data?.message || err.message), 'error');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      if (confirm('¿Cerrar sesión?')) {
        await logout();
      }
    });

    init();
  </script>
</body>
</html>
