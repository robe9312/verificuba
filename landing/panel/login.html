<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - VerifiCuba Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 10V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16v-6z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
      </div>
      <h1>VerifiCuba Panel</h1>
      <p class="subtitle">Inicia sesión para gestionar tu negocio</p>

      <div id="alert-container"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="whatsapp">WhatsApp</label>
          <input type="tel" id="whatsapp" name="whatsapp" class="form-input" placeholder="+53 5 XXXXXXX" required autocomplete="tel">
          <div class="form-error" id="whatsapp-error">Ingresa tu número de WhatsApp</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <div class="form-error" id="password-error">Ingresa tu contraseña</div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" id="login-btn">
          <span id="btn-text">Iniciar sesión</span>
          <span id="btn-loading" style="display:none;">Entrando...</span>
        </button>
      </form>

      <p class="text-center text-muted mt-3" style="font-size: 0.875rem;">
        ¿No tienes cuenta? <a href="#" id="register-link">Regístrate</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { pb } from './js/pb.js';

    // Redirect if already logged in
    if (pb.authStore.isValid) {
      window.location.href = '/panel/dashboard.html';
    }

    const form = document.getElementById('login-form');
    const btn = document.getElementById('login-btn');
    const btnText = document.getElementById('btn-text');
    const btnLoading = document.getElementById('btn-loading');
    const alertContainer = document.getElementById('alert-container');

    function showAlert(message, type = 'error') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'}
          </svg>
          <span>${message}</span>
        </div>
      `;
    }

    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(el => el.classList.remove('visible'));
      document.querySelectorAll('.form-input').forEach(el => el.style.borderColor = '');
    }

    function setLoading(loading) {
      btn.disabled = loading;
      btnText.style.display = loading ? 'none' : 'inline';
      btnLoading.style.display = loading ? 'inline' : 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const whatsapp = form.whatsapp.value.trim();
      const password = form.password.value;

      if (!whatsapp) {
        document.getElementById('whatsapp-error').classList.add('visible');
        form.whatsapp.focus();
        return;
      }
      if (!password) {
        document.getElementById('password-error').classList.add('visible');
        form.password.focus();
        return;
      }

      setLoading(true);

      try {
        await pb.collection('users').authWithPassword(whatsapp, password);
        window.location.href = '/panel/dashboard.html';
      } catch (err) {
        setLoading(false);
        const msg = err.response?.data?.message || err.message || 'Error al iniciar sesión';
        showAlert(msg, 'error');
      }
    });

    // Register link - for now just show alert
    document.getElementById('register-link').addEventListener('click', (e) => {
      e.preventDefault();
      showAlert('El registro se hace desde la landing page. Ve a verificuba.netlify.app y completa el formulario.', 'warning');
    });
  </script>
</body>
</html>
