<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facturas - VerifiCuba Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel-layout">
    <nav id="panel-nav" class="panel-sidebar"></nav>

    <main class="panel-main">
      <header class="panel-header">
        <h1>Facturas</h1>
        <p class="subtitle">Genera y gestiona tus facturas</p>
      </header>

      <div id="alert-container"></div>

      <!-- New invoice form -->
      <div class="panel-card" id="new-invoice-card">
        <h2>Nueva factura</h2>
        <form id="invoice-form" novalidate>
          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Número de factura</label>
              <input type="text" id="numero" name="numero" class="form-input" placeholder="F-001" required>
            </div>
            <div class="form-group">
              <label class="form-label">Fecha</label>
              <input type="date" id="fecha" name="fecha" class="form-input" required>
            </div>
          </div>

          <div id="items-container">
            <h3 style="margin: 1rem 0 0.5rem;">Conceptos</h3>
            <div class="table-container">
              <table class="table" id="items-table">
                <thead>
                  <tr>
                    <th style="width: 50%;">Descripción</th>
                    <th style="width: 15%;">Cantidad</th>
                    <th style="width: 20%;">Precio unitario</th>
                    <th style="width: 15%;">Subtotal</th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="items-tbody">
                  <!-- Rows added dynamically -->
                </tbody>
              </table>
            </div>
            <button type="button" id="add-item" class="btn btn-secondary btn-sm mt-2">+ Agregar concepto</button>
          </div>

          <div class="grid grid-3" style="gap: 1rem; margin-top: 1rem;">
            <div class="form-group">
              <label class="form-label">Subtotal</label>
              <input type="text" id="subtotal" class="form-input" readonly style="background: var(--surface-alt);">
            </div>
            <div class="form-group">
              <label class="form-label">Impuesto (10%)</label>
              <input type="text" id="impuesto" class="form-input" readonly style="background: var(--surface-alt);">
            </div>
            <div class="form-group">
              <label class="form-label">Total</label>
              <input type="text" id="total" class="form-input" readonly style="background: var(--surface-alt); font-weight: 700; font-size: 1.125rem;">
            </div>
          </div>

          <div class="flex gap-2 mt-3">
            <button type="submit" class="btn btn-primary btn-lg">Guardar factura</button>
            <button type="button" id="preview-btn" class="btn btn-secondary btn-lg">Vista previa PDF</button>
          </div>
        </form>
      </div>

      <!-- Invoices list -->
      <div class="panel-card">
        <div class="flex flex-between" style="margin-bottom:1rem;">
          <h2>Facturas guardadas</h2>
          <button type="button" id="new-invoice-btn" class="btn btn-secondary">+ Nueva factura</button>
        </div>
        <div class="table-container">
          <table class="table" id="invoices-table">
            <thead>
              <tr>
                <th>Número</th>
                <th>Fecha</th>
                <th>Conceptos</th>
                <th>Subtotal</th>
                <th>Impuesto</th>
                <th>Total</th>
                <th>PDF</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="invoices-tbody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
        <p id="invoices-empty" class="text-center text-muted" style="display:none; padding:2rem;">No hay facturas guardadas.</p>
      </div>
    </main>
  </div>

  <script type="module">
    import { pb } from './js/pb.js';
    import { initNav } from './js/nav.js';
    import { getCurrentNegocioId } from './js/auth.js';
    import { encolarLocal } from './js/sync-queue.js';

    initNav();

    const alertContainer = document.getElementById('alert-container');
    const invoiceForm = document.getElementById('invoice-form');
    const newInvoiceCard = document.getElementById('new-invoice-card');
    const itemsTbody = document.getElementById('items-tbody');
    const addItemBtn = document.getElementById('add-item');
    const subtotalEl = document.getElementById('subtotal');
    const impuestoEl = document.getElementById('impuesto');
    const totalEl = document.getElementById('total');
    const invoicesTbody = document.getElementById('invoices-tbody');
    const invoicesEmpty = document.getElementById('invoices-empty');
    const newInvoiceBtn = document.getElementById('new-invoice-btn');
    const previewBtn = document.getElementById('preview-btn');

    let currentNegocioId = null;
    let itemCounter = 0;

    function showAlert(message, type = 'info') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'}
          </svg>
          <span>${message}</span>
        </div>
      `;
      setTimeout(() => alertContainer.innerHTML = '', 5000);
    }

    function formatCUP(amount) {
      return new Intl.NumberFormat('es-CU', { style: 'currency', currency: 'CUP', maximumFractionDigits: 2 }).format(amount);
    }

    function addItemRow(item = {}) {
      const id = ++itemCounter;
      const row = document.createElement('tr');
      row.dataset.id = id;
      row.innerHTML = `
        <td><input type="text" name="descripcion" class="form-input" placeholder="Descripción del servicio/producto" value="${item.descripcion || ''}" required></td>
        <td><input type="number" name="cantidad" class="form-input" placeholder="1" step="0.01" min="0.01" value="${item.cantidad || 1}" required></td>
        <td><input type="number" name="precio" class="form-input" placeholder="0.00" step="0.01" min="0" value="${item.precio || ''}" required></td>
        <td><input type="text" name="subtotal" class="form-input" readonly style="background: var(--surface-alt);"></td>
        <td><button type="button" class="btn btn-sm btn-danger" onclick="removeItem(${id})">×</button></td>
      `;
      itemsTbody.appendChild(row);

      // Add listeners
      row.querySelectorAll('input[name="cantidad"], input[name="precio"]').forEach(input => {
        input.addEventListener('input', calculateTotals);
      });
    }

    window.removeItem = function(id) {
      const row = itemsTbody.querySelector(`tr[data-id="${id}"]`);
      if (row) {
        row.remove();
        calculateTotals();
      }
    };

    function calculateTotals() {
      let subtotal = 0;
      itemsTbody.querySelectorAll('tr').forEach(row => {
        const cantidad = parseFloat(row.querySelector('input[name="cantidad"]').value) || 0;
        const precio = parseFloat(row.querySelector('input[name="precio"]').value) || 0;
        const itemSubtotal = cantidad * precio;
        row.querySelector('input[name="subtotal"]').value = formatCUP(itemSubtotal);
        subtotal += itemSubtotal;
      });
      const impuesto = subtotal * 0.10;
      const total = subtotal + impuesto;

      subtotalEl.value = formatCUP(subtotal);
      impuestoEl.value = formatCUP(impuesto);
      totalEl.value = formatCUP(total);
    }

    function getItemsData() {
      const items = [];
      itemsTbody.querySelectorAll('tr').forEach(row => {
        items.push({
          descripcion: row.querySelector('input[name="descripcion"]').value,
          cantidad: parseFloat(row.querySelector('input[name="cantidad"]').value),
          precio: parseFloat(row.querySelector('input[name="precio"]').value),
          subtotal: parseFloat(row.querySelector('input[name="cantidad"]').value) * parseFloat(row.querySelector('input[name="precio"]').value)
        });
      });
      return items;
    }

    function generatePDF(invoice) {
      // Simple PDF generation using window.print with a print-friendly layout
      const printWindow = window.open('', '_blank');
      const itemsHtml = invoice.items.map(item => `
        <tr>
          <td style="padding:8px; border:1px solid #ddd;">${item.descripcion}</td>
          <td style="padding:8px; border:1px solid #ddd; text-align:center;">${item.cantidad}</td>
          <td style="padding:8px; border:1px solid #ddd; text-align:right;">${formatCUP(item.precio)}</td>
          <td style="padding:8px; border:1px solid #ddd; text-align:right;">${formatCUP(item.subtotal)}</td>
        </tr>
      `).join('');

      printWindow.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
          <title>Factura ${invoice.numero}</title>
          <style>
            body { font-family: Arial, sans-serif; padding: 20px; }
            .header { text-align: center; margin-bottom: 30px; }
            .info { display: flex; justify-content: space-between; margin-bottom: 20px; }
            table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            th, td { padding: 8px; border: 1px solid #ddd; }
            th { background: #f5f5f5; }
            .totals { width: 300px; margin-left: auto; }
            .totals tr td { padding: 5px 10px; }
            .totals tr:last-child td { font-weight: bold; font-size: 1.2em; border-top: 2px solid #000; }
            @media print { .no-print { display: none; } }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>FACTURA</h1>
            <p>VerifiCuba - Factura N° ${invoice.numero}</p>
          </div>
          <div class="info">
            <div>
              <strong>Fecha:</strong> ${new Date(invoice.fecha).toLocaleDateString('es-CU')}<br>
              <strong>Negocio:</strong> ${invoice.negocio_nombre || 'Tu negocio'}
            </div>
            <div style="text-align:right;">
              <strong>Subtotal:</strong> ${formatCUP(invoice.subtotal)}<br>
              <strong>Impuesto (10%):</strong> ${formatCUP(invoice.impuesto)}<br>
              <strong>Total:</strong> ${formatCUP(invoice.total)}
            </div>
          </div>
          <table>
            <thead>
              <tr>
                <th>Descripción</th>
                <th>Cant.</th>
                <th>P. Unit.</th>
                <th>Subtotal</th>
              </tr>
            </thead>
            <tbody>
              ${itemsHtml}
            </tbody>
          </table>
          <table class="totals">
            <tr><td>Subtotal</td><td style="text-align:right;">${formatCUP(invoice.subtotal)}</td></tr>
            <tr><td>Impuesto (10%)</td><td style="text-align:right;">${formatCUP(invoice.impuesto)}</td></tr>
            <tr><td>TOTAL</td><td style="text-align:right;">${formatCUP(invoice.total)}</td></tr>
          </table>
          <div style="margin-top:40px; text-align:center; color:#666; font-size:0.8em;">
            Generado por VerifiCuba - verificuba.netlify.app
          </div>
          <script>
            window.onload = function() { window.print(); }
          <\/script>
        </body>
        </html>
      `);
      printWindow.document.close();
    }

    async function loadInvoices() {
      if (!currentNegocioId) return;

      try {
        const records = await pb.collection('facturas').getList(1, 50, {
          filter: `negocio = "${currentNegocioId}"`,
          sort: '-fecha'
        });

        if (records.items.length === 0) {
          invoicesTbody.innerHTML = '';
          invoicesEmpty.style.display = 'block';
          return;
        }

        invoicesEmpty.style.display = 'none';
        invoicesTbody.innerHTML = records.items.map(f => `
          <tr>
            <td>${f.numero}</td>
            <td>${new Date(f.fecha).toLocaleDateString('es-CU')}</td>
            <td>${f.items?.length || 0} conceptos</td>
            <td>${formatCUP(f.subtotal)}</td>
            <td>${formatCUP(f.impuesto)}</td>
            <td><strong>${formatCUP(f.total)}</strong></td>
            <td>${f.pdf ? '<span class="badge badge-verificado">PDF</span>' : '<span class="badge badge-pending">Sin PDF</span>'}</td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="viewPDF('${f.id}')">Ver</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Load invoices error:', err);
        showAlert('Error cargando facturas: ' + err.message, 'error');
      }
    }

    window.viewPDF = async function(id) {
      try {
        const record = await pb.collection('facturas').getOne(id);
        generatePDF(record);
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      }
    };

    async function init() {
      currentNegocioId = await getCurrentNegocioId();
      if (!currentNegocioId) {
        showAlert('No se encontró tu negocio. Completa tu perfil primero.', 'warning');
        return;
      }

      // Set today's date
      document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

      // Add first item row
      addItemRow();

      await loadInvoices();
    }

    newInvoiceBtn.addEventListener('click', () => {
      newInvoiceCard.style.display = 'block';
      newInvoiceBtn.style.display = 'none';
      window.scrollTo({ top: newInvoiceCard.offsetTop - 100, behavior: 'smooth' });
    });

    addItemBtn.addEventListener('click', () => addItemRow());

    invoiceForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const items = getItemsData();
      if (items.length === 0) {
        showAlert('Agrega al menos un concepto', 'error');
        return;
      }

      if (items.some(i => !i.descripcion || !i.cantidad || !i.precio)) {
        showAlert('Completa todos los campos de los conceptos', 'error');
        return;
      }

      const subtotal = items.reduce((sum, i) => sum + i.subtotal, 0);
      const impuesto = subtotal * 0.10;
      const total = subtotal + impuesto;

      const submitBtn = invoiceForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      const data = {
        negocio: currentNegocioId,
        numero: invoiceForm.numero.value,
        fecha: invoiceForm.fecha.value,
        items,
        subtotal,
        impuesto,
        total
      };

      try {
        const record = await pb.collection('facturas').create(data);
        showAlert('Factura guardada: ' + record.numero, 'success');
        
        // Reset form
        invoiceForm.reset();
        itemsTbody.innerHTML = '';
        itemCounter = 0;
        addItemRow();
        calculateTotals();
        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        
        await loadInvoices();
      } catch (err) {
        encolarLocal({ collection: 'facturas', data });
        showAlert('Sin conexión. Guardado localmente.', 'warning');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar factura';
      }
    });

    previewBtn.addEventListener('click', () => {
      const items = getItemsData();
      if (items.length === 0) {
        showAlert('Agrega conceptos primero', 'error');
        return;
      }

      const subtotal = items.reduce((sum, i) => sum + i.subtotal, 0);
      const impuesto = subtotal * 0.10;
      const total = subtotal + impuesto;

      generatePDF({
        numero: invoiceForm.numero.value || 'BORRADOR',
        fecha: invoiceForm.fecha.value,
        negocio_nombre: 'Tu negocio',
        items,
        subtotal,
        impuesto,
        total
      });
    });

    init();
  </script>
</body>
</html>
