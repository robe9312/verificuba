<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finanzas - VerifiCuba Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/panel.css">
</head>
<body>
  <div class="panel-layout">
    <nav id="panel-nav" class="panel-sidebar"></nav>

    <main class="panel-main">
      <header class="panel-header">
        <h1>Finanzas</h1>
        <p class="subtitle">Control de ingresos, gastos y balance</p>
      </header>

      <div id="alert-container"></div>

      <!-- Stats -->
      <div class="grid grid-4" id="stats-grid">
        <!-- Filled by JS -->
      </div>

      <!-- Add transaction form -->
      <div class="panel-card" id="new-transaction-card" style="display:none;">
        <h2>Nuevo registro</h2>
        <form id="transaction-form" novalidate>
          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Tipo</label>
              <select id="tipo" name="tipo" class="form-select" required>
                <option value="">Selecciona...</option>
                <option value="ingreso">💰 Ingreso</option>
                <option value="gasto">💸 Gasto</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Categoría</label>
              <input type="text" id="categoria" name="categoria" class="form-input" placeholder="Ej: Servicios, Materiales, Ventas" required>
            </div>
          </div>

          <div class="grid grid-2" style="gap: 1rem;">
            <div class="form-group">
              <label class="form-label">Monto (CUP)</label>
              <input type="number" id="monto" name="monto" class="form-input" placeholder="0.00" step="0.01" min="0.01" required>
            </div>
            <div class="form-group">
              <label class="form-label">Fecha</label>
              <input type="date" id="fecha" name="fecha" class="form-input" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Descripción (opcional)</label>
            <textarea id="descripcion" name="descripcion" class="form-textarea" rows="2" placeholder="Detalles adicionales..."></textarea>
          </div>

          <div class="flex gap-2">
            <button type="submit" class="btn btn-primary">Guardar</button>
            <button type="button" id="cancel-transaction" class="btn btn-secondary">Cancelar</button>
          </div>
        </form>
      </div>

      <button type="button" id="new-transaction-btn" class="btn btn-primary mb-3">+ Nuevo registro</button>

      <!-- Transactions list -->
      <div class="panel-card">
        <h2>Historial de transacciones</h2>
        <div class="table-container">
          <table class="table" id="transactions-table">
            <thead>
              <tr>
                <th>Fecha</th>
                <th>Tipo</th>
                <th>Categoría</th>
                <th>Monto</th>
                <th>Descripción</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="transactions-tbody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
        <p id="transactions-empty" class="text-center text-muted" style="display:none; padding:2rem;">No hay transacciones registradas.</p>
      </div>

      <!-- Monthly summary -->
      <div class="panel-card" id="monthly-summary" style="display:none;">
        <h2>Resumen mensual</h2>
        <div class="table-container">
          <table class="table">
            <thead>
              <tr>
                <th>Mes</th>
                <th>Ingresos</th>
                <th>Gastos</th>
                <th>Balance</th>
              </tr>
            </thead>
            <tbody id="monthly-tbody">
              <!-- Filled by JS -->
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { pb } from './js/pb.js';
    import { initNav } from './js/nav.js';
    import { getCurrentNegocioId } from './js/auth.js';
    import { encolarLocal } from './js/sync-queue.js';

    initNav();

    const alertContainer = document.getElementById('alert-container');
    const statsGrid = document.getElementById('stats-grid');
    const newTransactionCard = document.getElementById('new-transaction-card');
    const transactionForm = document.getElementById('transaction-form');
    const newTransactionBtn = document.getElementById('new-transaction-btn');
    const cancelTransactionBtn = document.getElementById('cancel-transaction');
    const transactionsTbody = document.getElementById('transactions-tbody');
    const transactionsEmpty = document.getElementById('transactions-empty');
    const monthlyTbody = document.getElementById('monthly-tbody');
    const monthlySummary = document.getElementById('monthly-summary');

    let currentNegocioId = null;
    let allTransactions = [];

    function showAlert(message, type = 'info') {
      alertContainer.innerHTML = `
        <div class="alert alert-${type}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" flex-shrink="0">
            ${type === 'error' ? '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>' : '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>'}
          </svg>
          <span>${message}</span>
        </div>
      `;
      setTimeout(() => alertContainer.innerHTML = '', 5000);
    }

    function formatCUP(amount) {
      return new Intl.NumberFormat('es-CU', { style: 'currency', currency: 'CUP', maximumFractionDigits: 2 }).format(amount);
    }

    function getBadgeClass(tipo) {
      return tipo === 'ingreso' ? 'badge-verificado' : 'badge-pending';
    }

    async function loadData() {
      if (!currentNegocioId) return;

      try {
        const records = await pb.collection('transacciones').getList(1, 200, {
          filter: `negocio = "${currentNegocioId}"`,
          sort: '-fecha'
        });

        allTransactions = records.items;
        renderStats();
        renderTransactions();
        renderMonthlySummary();
      } catch (err) {
        console.error('Load transactions error:', err);
        showAlert('Error cargando transacciones: ' + err.message, 'error');
      }
    }

    function renderStats() {
      const totalIngresos = allTransactions
        .filter(t => t.tipo === 'ingreso')
        .reduce((sum, t) => sum + t.monto, 0);
      const totalGastos = allTransactions
        .filter(t => t.tipo === 'gasto')
        .reduce((sum, t) => sum + t.monto, 0);
      const balance = totalIngresos - totalGastos;
      const count = allTransactions.length;

      statsGrid.innerHTML = `
        <div class="stat-card">
          <div class="label">Total ingresos</div>
          <div class="value success">${formatCUP(totalIngresos)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Total gastos</div>
          <div class="value danger">${formatCUP(totalGastos)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Balance neto</div>
          <div class="value ${balance >= 0 ? 'success' : 'danger'}">${formatCUP(balance)}</div>
        </div>
        <div class="stat-card">
          <div class="label">Registros</div>
          <div class="value primary">${count}</div>
        </div>
      `;
    }

    function renderTransactions() {
      if (allTransactions.length === 0) {
        transactionsTbody.innerHTML = '';
        transactionsEmpty.style.display = 'block';
        monthlySummary.style.display = 'none';
        return;
      }

      transactionsEmpty.style.display = 'none';
      monthlySummary.style.display = 'block';

      transactionsTbody.innerHTML = allTransactions.map(t => `
        <tr>
          <td>${new Date(t.fecha).toLocaleDateString('es-CU')}</td>
          <td><span class="badge ${getBadgeClass(t.tipo)}">${t.tipo === 'ingreso' ? '💰 Ingreso' : '💸 Gasto'}</span></td>
          <td>${t.categoria}</td>
          <td class="${t.tipo === 'ingreso' ? 'success' : 'danger'}"><strong>${formatCUP(t.monto)}</strong></td>
          <td>${t.descripcion || '-'}</td>
          <td>
            <button class="btn btn-sm btn-danger" onclick="deleteTransaction('${t.id}')">Eliminar</button>
          </td>
        </tr>
      `).join('');
    }

    function renderMonthlySummary() {
      const byMonth = {};
      allTransactions.forEach(t => {
        const month = t.fecha.substring(0, 7); // YYYY-MM
        if (!byMonth[month]) byMonth[month] = { ingresos: 0, gastos: 0 };
        if (t.tipo === 'ingreso') byMonth[month].ingresos += t.monto;
        else byMonth[month].gastos += t.monto;
      });

      const months = Object.keys(byMonth).sort().reverse();
      monthlyTbody.innerHTML = months.map(month => {
        const data = byMonth[month];
        const balance = data.ingresos - data.gastos;
        const [year, monthNum] = month.split('-');
        const label = new Date(year, monthNum - 1).toLocaleDateString('es-CU', { month: 'long', year: 'numeric' });
        return `
          <tr>
            <td>${label}</td>
            <td class="success">${formatCUP(data.ingresos)}</td>
            <td class="danger">${formatCUP(data.gastos)}</td>
            <td class="${balance >= 0 ? 'success' : 'danger'}"><strong>${formatCUP(balance)}</strong></td>
          </tr>
        `;
      }).join('');
    }

    window.deleteTransaction = async function(id) {
      if (!confirm('¿Eliminar esta transacción?')) return;

      try {
        await pb.collection('transacciones').delete(id);
        showAlert('Transacción eliminada', 'success');
        await loadData();
      } catch (err) {
        showAlert('Error: ' + err.message, 'error');
      }
    };

    async function init() {
      currentNegocioId = await getCurrentNegocioId();
      if (!currentNegocioId) {
        showAlert('No se encontró tu negocio. Completa tu perfil primero.', 'warning');
        return;
      }

      document.getElementById('fecha').value = new Date().toISOString().split('T')[0];

      await loadData();
    }

    newTransactionBtn.addEventListener('click', () => {
      newTransactionCard.style.display = 'block';
      newTransactionBtn.style.display = 'none';
      document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
    });

    cancelTransactionBtn.addEventListener('click', () => {
      newTransactionCard.style.display = 'none';
      newTransactionBtn.style.display = 'inline-flex';
      transactionForm.reset();
    });

    transactionForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const tipo = transactionForm.tipo.value;
      const categoria = transactionForm.categoria.value.trim();
      const monto = parseFloat(transactionForm.monto.value);
      const fecha = transactionForm.fecha.value;
      const descripcion = transactionForm.descripcion.value.trim();

      if (!tipo || !categoria || isNaN(monto) || !fecha) {
        showAlert('Completa todos los campos obligatorios', 'error');
        return;
      }

      const submitBtn = transactionForm.querySelector('button[type="submit"]');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Guardando...';

      const data = {
        negocio: currentNegocioId,
        tipo,
        categoria,
        monto,
        fecha,
        descripcion
      };

      try {
        await pb.collection('transacciones').create(data);
        showAlert(`${tipo === 'ingreso' ? 'Ingreso' : 'Gasto'} registrado`, 'success');
        transactionForm.reset();
        document.getElementById('fecha').value = new Date().toISOString().split('T')[0];
        newTransactionCard.style.display = 'none';
        newTransactionBtn.style.display = 'inline-flex';
        await loadData();
      } catch (err) {
        encolarLocal({ collection: 'transacciones', data });
        showAlert('Sin conexión. Guardado localmente.', 'warning');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Guardar';
      }
    });

    init();
  </script>
</body>
</html>
