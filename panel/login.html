<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — VerifiCuba Panel</title>
  <link rel="stylesheet" href="/panel/css/panel.css">
  <style>
    .login-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .login-card { width: 100%; max-width: 420px; }
    .login-header { text-align: center; margin-bottom: 32px; }
    .login-logo { width: 64px; height: 64px; margin: 0 auto 16px; background: linear-gradient(135deg, var(--accent), var(--accent-strong)); border-radius: 16px; display: flex; align-items: center; justify-content: center; }
    .login-title { font-size: 1.5rem; font-weight: 700; margin: 0 0 8px; }
    .login-subtitle { color: var(--fg-muted); margin: 0; }
    .form-divider { display: flex; align-items: center; gap: 16px; margin: 24px 0; color: var(--fg-muted); font-size: 0.85rem; }
    .form-divider::before, .form-divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
    .btn-whatsapp { background: #128c7e; color: white; border: none; }
    .btn-whatsapp:hover { background: #0d6d5f; text-decoration: none; }
    .btn-whatsapp svg { color: white; }
    .auth-footer { text-align: center; margin-top: 24px; font-size: 0.85rem; color: var(--fg-muted); }
    .auth-footer a { font-weight: 500; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; }
  </style>
</head>
<body>
  <main class="login-page" role="main">
    <div class="card login-card">
      <header class="login-header">
        <div class="login-logo" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0b0d10" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <h1 class="login-title">VerifiCuba Panel</h1>
        <p class="login-subtitle">Inicia sesión para gestionar tu negocio</p>
      </header>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="whatsapp">WhatsApp</label>
          <input type="tel" id="whatsapp" name="whatsapp" class="form-input" placeholder="+53 5 XXXXXXX" required autocomplete="tel" pattern="^\+53[0-9]{8}$" aria-describedby="whatsappHelp">
          <div id="whatsappHelp" class="form-help">Formato: +53 5 XXXXXXX (solo números cubanos)</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" minlength="8">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">Entrar</button>
      </form>

      <div class="form-divider">o regístrate</div>

      <form id="registerForm" novalidate hidden>
        <div class="form-group">
          <label class="form-label" for="regWhatsapp">WhatsApp</label>
          <input type="tel" id="regWhatsapp" name="whatsapp" class="form-input" placeholder="+53 5 XXXXXXX" required autocomplete="tel" pattern="^\+53[0-9]{8}$">
        </div>
        <div class="form-group">
          <label class="form-label" for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" minlength="8">
        </div>
        <div class="form-group">
          <label class="form-label" for="regPasswordConfirm">Confirmar contraseña</label>
          <input type="password" id="regPasswordConfirm" name="passwordConfirm" class="form-input" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-full btn-lg">Crear cuenta</button>
      </form>

      <p class="auth-footer">
        <span id="toggleAuth">¿No tienes cuenta? Regístrate</span>
      </p>
    </div>
  </main>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script type="module">
    import { pb } from '/panel/js/pb.js';
    import { initSync } from '/panel/js/sync-queue.js';

    // Already logged in?
    if (pb.authStore.isValid) {
      window.location.href = '/panel/dashboard.html';
    }

    // Initialize sync queue
    initSync(pb);

    const loginForm = document.getElementById('loginForm');
    const registerForm = document.getElementById('registerForm');
    const toggleAuth = document.getElementById('toggleAuth');
    const toast = document.getElementById('toast');

    function showToast(msg, type = 'ok') {
      toast.textContent = msg;
      toast.className = `toast ${type}`;
      toast.hidden = false;
      setTimeout(() => { toast.hidden = true; }, 4000);
    }

    function setLoading(form, loading) {
      const btn = form.querySelector('button[type="submit"]');
      btn.disabled = loading;
      btn.textContent = loading ? 'Procesando...' : (form === loginForm ? 'Entrar' : 'Crear cuenta');
    }

    // Toggle between login/register
    toggleAuth.addEventListener('click', (e) => {
      e.preventDefault();
      const isLogin = !loginForm.hidden;
      loginForm.hidden = isLogin;
      registerForm.hidden = !isLogin;
      toggleAuth.textContent = isLogin ? '¿Ya tienes cuenta? Inicia sesión' : '¿No tienes cuenta? Regístrate';
    });

    // Login
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(loginForm, true);

      const formData = new FormData(loginForm);
      const whatsapp = formData.get('whatsapp');
      const password = formData.get('password');

      try {
        await pb.collection('users').authWithPassword(whatsapp, password);
        showToast('✅ Sesión iniciada', 'ok');
        window.location.href = '/panel/dashboard.html';
      } catch (err) {
        console.error(err);
        const msg = err.response?.data?.message || 'Credenciales inválidas';
        showToast(`❌ ${msg}`, 'err');
      } finally {
        setLoading(loginForm, false);
      }
    });

    // Register
    registerForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      setLoading(registerForm, true);

      const formData = new FormData(registerForm);
      const whatsapp = formData.get('whatsapp');
      const password = formData.get('password');
      const passwordConfirm = formData.get('passwordConfirm');

      if (password !== passwordConfirm) {
        showToast('❌ Las contraseñas no coinciden', 'err');
        setLoading(registerForm, false);
        return;
      }

      try {
        await pb.collection('users').create({ whatsapp, password, passwordConfirm });
        // Auto-login after register
        await pb.collection('users').authWithPassword(whatsapp, password);
        showToast('✅ Cuenta creada', 'ok');
        window.location.href = '/panel/dashboard.html';
      } catch (err) {
        console.error(err);
        const msg = err.response?.data?.message?.whatsapp?.[0]?.message || 'Error al registrar';
        showToast(`❌ ${msg}`, 'err');
      } finally {
        setLoading(registerForm, false);
      }
    });
  </script>
</body>
</html>
