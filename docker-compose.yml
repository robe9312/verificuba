version: '3.8'

services:
  nocodb:
    image: nocodb/nocodb:latest
    container_name: verificuba-nocodb
    ports:
      - "8080:8080"
    environment:
      NC_DB: "sqlite:///usr/app/data/verificuba.db"
      NC_AUTH_JWT_SECRET: "${JWT_SECRET:-cambia-esto-en-produccion}"
      NC_PUBLIC_URL: "http://localhost:8080"
      NC_DISABLE_TELEMETRY: "true"
    volumes:
      - nocodb-data:/usr/app/data
      - ./uploads:/usr/app/public/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/v1/health').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: verificuba-telegram-bot
    environment:
      BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      NOCODB_URL: "http://nocodb:8080"
      NOCODB_TOKEN: "${NOCODB_API_TOKEN:-}"
    depends_on:
      nocodb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nocodb-data:

networks:
  default:
    name: verificuba-network
